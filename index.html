<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>
		#img{width:100%;}
	</style>
</head>
<body>
	<img src="1.jpg" id="img1">
	<audio src="1.wav" id="snd1"></audio>
 
	<img src="2.jpg" id="img2">
	<audio src="2.wav" id="snd2"></audio>

	<script>
	let keyboard = "no";
	img1.onclick = function(){
		if (keyboard == "no"){
			snd1.play();
			img1.style.opacity = "30%";
			keyboard = "yes";
		}else if (keyboard == "yes"){
			snd1.pause();
			snd1.currentTime = 0;
			img1.style.opacity = "1";
			keyboard = "no";
		}
	};

</body>
